[general]
import = [
  "./keyboard.toml",
  "./colors.toml",
  # Scratchpad to test live changes
  "~/.config/alacritty/scratchpad.toml"
]

[font]
size = 18.0

[font.normal]
family = "MesloLGS Nerd Font Mono"

[[hints.enabled]]
command = "open"
post_processing = true
regex = "(mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.mouse]
enabled = true
mods = "Command"

[terminal.shell]
# Apps opened from the Dock get launchd's PATH, so a bare "zsh" is macOS's
# /bin/zsh. It can't load Nix terminfo entries such as alacritty when it
# starts, which breaks line editing and colors outside zellij.
program = "/run/current-system/sw/bin/zsh"

[env]
# zellij and other tools start $SHELL; keep them on the same zsh.
SHELL = "/run/current-system/sw/bin/zsh"

[window]
option_as_alt = "Both"
