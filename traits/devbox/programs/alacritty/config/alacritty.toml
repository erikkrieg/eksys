[general]
import = [
  "./keyboard.toml",
  "./colors.toml",
  # Scratchpad to test live changes
  "~/.config/alacritty/scratchpad.toml"
]

[font]
size = 18.0

[font.normal]
family = "MesloLGS Nerd Font Mono"

[[hints.enabled]]
command = "open"
post_processing = true
regex = "(mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.mouse]
enabled = true
mods = "Command"

[terminal.shell]
program = "zsh"

[window]
option_as_alt = "Both"
